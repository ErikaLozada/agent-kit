# Project settings read by scripts/*.sh and .githooks/pre-commit. Bash syntax; leave a value empty to turn that part off.

PROJECT="{{PROJECT}}"

SERVICE=""          # systemd user unit that runs the app (make deploy restarts it); empty: no deploy
HEALTH_URL=""       # checked after a restart, e.g. http://127.0.0.1:8000/
TEST_CMD=""         # how to run the tests; empty: tests/test_*.py with unittest and tests/*.test.*js with node

LINKS=""            # untracked paths a task worktree needs from the main copy (globs ok), e.g. "data/* .env"
OWN=""              # of those, paths each worktree keeps its own (written by the live app), e.g. "data/cache.json"
TEST_PORT=8001      # first port handed to task test servers
TEST_SERVER=""      # command that starts a test server, with {PORT} for the task's port, written into each TASK.md

PROTECTED=""        # files only the user changes; the pre-commit hook refuses them unless USER_OK=1
