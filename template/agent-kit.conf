# Project settings read by scripts/*.sh and .githooks/pre-commit. Bash syntax; leave a value empty to turn that part off.

PROJECT="{{PROJECT}}"

DEPLOY_CMD=""       # stack-agnostic deploy command (runs after clean-tree + --require-tests checks); overrides SERVICE
SERVICE=""          # optional Linux systemd user unit shortcut when DEPLOY_CMD is empty; empty: no deploy
HEALTH_URL=""       # checked after deploy/restart, e.g. http://127.0.0.1:8000/
TEST_CMD=""         # how to run the tests; empty: tests/test_*.py with unittest and tests/*.test.*js with node
ALLOW_NO_TESTS="${ALLOW_NO_TESTS:-0}" # 1 (here or `ALLOW_NO_TESTS=1 git commit`) permits commits with no tests run; reported NOT_EVALUATED, never PASS
OPTIONAL_TEST_SUITES="" # space-separated python/javascript; missing runtimes may skip ONLY these suites

REVIEW_CMD=""       # optional custom reviewer command ({BASE}, {OUT}, {PROMPT} placeholders); empty: uses KIND preset
WORKER_CMD=""       # optional custom worker command ({WT}, {NAME}, {MODEL}, {EFFORT} placeholders); empty: uses KIND preset

LINKS=""            # untracked paths a task worktree needs from the main copy (globs ok), e.g. "data/* .env"
OWN=""              # of those, paths each worktree keeps its own (written by the live app), e.g. "data/cache.json"
TEST_PORT=8001      # first port handed to task test servers
TEST_SERVER=""      # command that starts a test server, with {PORT} for the task's port, written into each TASK.md

PROTECTED=""        # files only the user changes; the pre-commit hook refuses them unless USER_OK=1
